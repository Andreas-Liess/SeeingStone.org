<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SeeingStone — Ad 04 render surface</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('../assets/fonts/Inter-var.woff2') format('woff2');
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('../assets/fonts/JetBrainsMono-var.woff2') format('woff2');
      font-weight: 100 900;
      font-display: block;
    }
    html, body { margin: 0; padding: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="scene-anniversary.js"></script>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    let STRINGS = null;

    window.ready = (async () => {
      await document.fonts.load('400 20px "JetBrains Mono"');
      await document.fonts.load('700 20px "JetBrains Mono"');
      await document.fonts.load('600 20px "Inter"');
      await document.fonts.ready;
      return true;
    })();

    window.setStrings = (s) => { STRINGS = s; };
    window.renderFrame = (f) => { window.SS.draw(ctx, f, STRINGS); return true; };
    window.meta = () => ({ W: window.SS.W, H: window.SS.H, FPS: window.SS.FPS, TOTAL: window.SS.TOTAL });
  </script>
</body>
</html>
